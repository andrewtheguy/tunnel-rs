# Expose internal ClusterIP services to remote peers via tunnel-rs — an
# alternative to kubectl port-forward that also carries UDP.
#
# Setup walkthrough and client commands: ../README.md#kubernetes
# Requires the tunnel-server-secrets secret (step 1-3 there).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunnel-server
  labels:
    app: tunnel-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tunnel-server
  template:
    metadata:
      labels:
        app: tunnel-server
    spec:
      # Node network namespace, giving hole punching a chance at a direct path;
      # ClusterFirstWithHostNet keeps *.svc.cluster.local resolvable.
      # Whether you need this, and the NetworkPolicy trade-off, are CNI-dependent:
      # ../README.md#hostnetwork-and-direct-connections
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: tunnel
          image: ghcr.io/andrewtheguy/tunnel-rs:v0.5.0
          # REPLACE the CIDRs below with your cluster's real pod and service
          # ranges: any authorized client can reach every address inside them.
          # The defaults are deliberately broad so this manifest starts anywhere.
          # How to look yours up: ../README.md#kubernetes
          args:
            - server
            - --allowed-tcp
            - "10.0.0.0/8"      # broad default - narrow to your pod/service CIDR
            - --allowed-tcp
            - "172.16.0.0/12"   # broad default - drop if unused
            - --allowed-udp
            - "10.0.0.0/8"      # broad default - narrow to your service CIDR (DNS etc.)
            - --secret-file
            - /secrets/server.key
            - --authorized-keys-file
            - /secrets/authorized_keys
            - --max-sessions
            - "20"
          volumeMounts:
            - name: server-secrets
              mountPath: /secrets
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: server-secrets
          secret:
            secretName: tunnel-server-secrets
