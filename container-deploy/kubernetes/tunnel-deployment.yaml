# Expose internal ClusterIP services to remote peers via tunnel-rs — an
# alternative to kubectl port-forward that also carries UDP.
#
# Setup walkthrough and client commands: ../README.md#kubernetes
# Requires the tunnel-server-secrets secret (step 1-3 there).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunnel-server
  labels:
    app: tunnel-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tunnel-server
  template:
    metadata:
      labels:
        app: tunnel-server
    spec:
      # Node network namespace, so hole punching can find a direct path instead
      # of relaying; ClusterFirstWithHostNet keeps *.svc.cluster.local resolvable.
      # Trade-off (network policies do not apply): ../README.md#hostnetwork-and-direct-connections
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: tunnel
          image: ghcr.io/andrewtheguy/tunnel-rs:latest
          args:
            - server
            - --allowed-tcp
            - "10.0.0.0/8"      # Kubernetes pod/service network
            - --allowed-tcp
            - "172.16.0.0/12"   # Alternative pod network
            - --allowed-udp
            - "10.0.0.0/8"      # For UDP services like DNS
            - --secret-file
            - /secrets/server.key
            - --authorized-keys-file
            - /secrets/authorized_keys
            - --max-sessions
            - "20"
          volumeMounts:
            - name: server-secrets
              mountPath: /secrets
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: server-secrets
          secret:
            secretName: tunnel-server-secrets
