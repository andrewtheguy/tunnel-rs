# Kubernetes example: tunnel-rs with hostNetwork for direct P2P connections
#
# This is a variant of tunnel-deployment.yaml that uses hostNetwork: true
# to bypass Kubernetes overlay networking. This enables iroh's STUN-based
# NAT hole-punching to work, allowing direct P2P connections instead of
# falling back to relay servers.
#
# When to use this variant:
#   - You want direct P2P connections (lower latency, no relay dependency)
#   - Single-node dev/homelab clusters
#   - The node has a public IP or is behind a simple (non-symmetric) NAT
#
# When NOT to use this variant:
#   - Multi-tenant clusters (hostNetwork bypasses network policies)
#   - You need Kubernetes network policy enforcement
#
# For the standard overlay networking deployment (relay fallback), use
# tunnel-deployment.yaml instead.
#
# Setup is the same as tunnel-deployment.yaml — see that file for
# step-by-step instructions.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunnel-server
  labels:
    app: tunnel-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tunnel-server
  template:
    metadata:
      labels:
        app: tunnel-server
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: tunnel
          image: ghcr.io/andrewtheguy/tunnel-rs:latest
          args:
            - server
            - --allowed-tcp
            - "10.0.0.0/8"      # Kubernetes pod/service network
            - --allowed-tcp
            - "172.16.0.0/12"   # Alternative pod network
            - --allowed-udp
            - "10.0.0.0/8"      # For UDP services like DNS
            - --secret-file
            - /secrets/server.key
            - --auth-tokens-file
            - /secrets/tokens.txt
            - --alpn-token-file
            - /secrets/alpn-token
            - --max-sessions
            - "20"
          volumeMounts:
            - name: server-secrets
              mountPath: /secrets
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: server-secrets
          secret:
            secretName: tunnel-server-secrets
