# Expose internal Docker services via tunnel-rs, without publishing any port.
#
# Setup walkthrough and client commands: ../README.md#docker
# Requires server.key and authorized_keys in this directory (step 1-2 there).

services:
  # Example web service
  web:
    image: nginx:alpine
    # No ports exposed - only accessible within Docker network

  # Example database service
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: example
    # No ports exposed - only accessible within Docker network

  # tunnel-rs server - exposes services to authenticated remote peers
  tunnel-server:
    image: ghcr.io/andrewtheguy/tunnel-rs:v0.5.0
    command:
      - server
      # Broad defaults so this file starts on any Docker install. Narrow them to
      # this project's network - any authorized client can reach every address
      # inside an allowed CIDR. See ../README.md#docker for the lookup command.
      - --allowed-tcp
      - "172.16.0.0/12"  # Docker default network range
      - --allowed-tcp
      - "192.168.0.0/16" # Docker bridge networks
      - --secret-file
      - /secrets/server.key
      - --authorized-keys-file
      - /secrets/authorized_keys
    volumes:
      - ./server.key:/secrets/server.key:ro
      - ./authorized_keys:/secrets/authorized_keys:ro
    depends_on:
      - web
      - db
