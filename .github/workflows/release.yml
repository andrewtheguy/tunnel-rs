name: Release (Manual)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (leave empty for auto-generated yyyymmddhhmmss)'
        required: false

permissions:
  contents: write
  packages: write

env:
  GHCR_IMAGE: ghcr.io/andrewtheguy/tunnel-rs

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
      is_prerelease: ${{ steps.tag.outputs.is_prerelease }}
      minor_version: ${{ steps.version.outputs.minor_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract minor version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          MINOR=$(echo "$VERSION" | cut -d. -f1-2)
          echo "minor_version=$MINOR" >> "$GITHUB_OUTPUT"
      - name: Generate Tag
        id: tag
        env:
          TAG: ${{ inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$TAG" ]; then
            echo "release_tag=$(date +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          elif [ "$REF_NAME" != "main" ]; then
            echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          elif echo "$TAG" | grep -qiE '(alpha|beta|rc)'; then
            echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build-linux:
    needs: setup
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-amd64
            docker_arch: amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: linux-arm64
            docker_arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Build Release
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Rename Binaries
        run: |
          mv target/${{ matrix.target }}/release/tunnel-rs target/release/tunnel-rs-${{ matrix.suffix }}

      - uses: actions/upload-artifact@v4
        with:
          name: tunnel-rs-${{ matrix.docker_arch }}
          path: target/release/tunnel-rs-${{ matrix.suffix }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.suffix }}
          path: target/release/tunnel-rs-${{ matrix.suffix }}

  build-macos:
    needs: setup
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Build Release
        run: |
          cargo build --release --target aarch64-apple-darwin

      - name: Rename Binaries
        run: |
          mv target/aarch64-apple-darwin/release/tunnel-rs target/release/tunnel-rs-macos-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: target/release/tunnel-rs-macos-arm64

  build-windows:
    needs: setup
    if: needs.setup.outputs.is_prerelease == 'false'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Build Release
        run: |
          cargo build --release --target x86_64-pc-windows-msvc

      - name: Rename Binaries
        run: |
          move target\x86_64-pc-windows-msvc\release\tunnel-rs.exe target\release\tunnel-rs-windows-amd64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-amd64
          path: target/release/tunnel-rs-windows-amd64.exe

  create-release:
    needs: [setup, build-linux, build-macos, build-windows]
    if: always() && needs.setup.result == 'success' && needs.build-linux.result == 'success' && needs.build-macos.result == 'success' && (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ needs.setup.outputs.release_tag }}
          prerelease: ${{ needs.setup.outputs.is_prerelease }}
          generate_release_notes: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    needs: [setup, build-linux]
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            suffix: linux-amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            suffix: linux-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tunnel-rs-${{ matrix.arch }}
          path: .
      - name: Prepare binary
        run: |
          mv tunnel-rs-${{ matrix.suffix }} tunnel-rs
          chmod +x tunnel-rs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.build
          target: runtime-prebuilt
          push: true
          tags: ${{ env.GHCR_IMAGE }}:${{ needs.setup.outputs.release_tag }}-${{ matrix.arch }}
          provenance: false
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}

  docker-manifest:
    needs: [setup, docker-build]
    runs-on: ubuntu-latest

    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          TAG=${{ needs.setup.outputs.release_tag }}

          docker manifest create ${{ env.GHCR_IMAGE }}:${TAG} \
            ${{ env.GHCR_IMAGE }}:${TAG}-amd64 \
            ${{ env.GHCR_IMAGE }}:${TAG}-arm64
          docker manifest push ${{ env.GHCR_IMAGE }}:${TAG}

      - name: Create and push minor version multi-arch manifest
        if: needs.setup.outputs.is_prerelease == 'false'
        run: |
          TAG=${{ needs.setup.outputs.release_tag }}
          MINOR=${{ needs.setup.outputs.minor_version }}

          docker manifest create ${{ env.GHCR_IMAGE }}:${MINOR} \
            ${{ env.GHCR_IMAGE }}:${TAG}-amd64 \
            ${{ env.GHCR_IMAGE }}:${TAG}-arm64
          docker manifest push ${{ env.GHCR_IMAGE }}:${MINOR}

      - name: Create and push latest multi-arch manifest
        if: needs.setup.outputs.is_prerelease == 'false'
        run: |
          TAG=${{ needs.setup.outputs.release_tag }}

          docker manifest create ${{ env.GHCR_IMAGE }}:latest \
            ${{ env.GHCR_IMAGE }}:${TAG}-amd64 \
            ${{ env.GHCR_IMAGE }}:${TAG}-arm64
          docker manifest push ${{ env.GHCR_IMAGE }}:latest
