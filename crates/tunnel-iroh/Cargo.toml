[package]
name = "tunnel-iroh"
version.workspace = true
edition = "2021"
description = "Iroh mode for tunnel-rs"

[lib]
name = "tunnel_iroh"
path = "src/lib.rs"

[dependencies]
tunnel-common = { path = "../tunnel-common" }
iroh = { version = "0.96.1", features = ["address-lookup-mdns"] }
iroh-quinn-proto = "0.15.1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
rand = "0.9"
base64 = "0.22"
log = "0.4"
url = "2"

[dev-dependencies]
tempfile = "3.24.0"
