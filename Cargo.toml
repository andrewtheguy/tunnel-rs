[package]
name = "tunnel-rs"
version = "0.3.6-alpha1"
edition = "2024"
description = "TCP/UDP port forwarding through iroh P2P connections"

[dependencies]
iroh = "1.0.0-rc.1"
iroh-mdns-address-lookup = "0.3.0"
noq-proto = "1.0.0-rc.1"
futures = "0.3"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["full"] }
socket2 = "0.6"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
rand = "0.9"
base64 = "0.22"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
age = { version = "0.11", default-features = false }
toml = "0.8"
ipnet = "2"
dirs = "6"
jiff = "0.2"

[dev-dependencies]
tempfile = "3.24.0"

# netwatch 0.18.0 never enables noq-udp's Apple UDP fast path
# (sendmsg_x/recvmsg_x, up to 32 packets per syscall), leaving macOS at one
# packet per syscall. Drop this patch once upstream enables it.
# See docs/PERFORMANCE.md.
[patch.crates-io]
netwatch = { git = "https://github.com/andrewchen5678/net-tools", branch = "apple-fast-path" }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
