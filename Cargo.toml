[package]
name = "tunnel-rs"
version = "0.6.0"
edition = "2024"
description = "TCP/UDP port forwarding through iroh P2P connections"

[dependencies]
iroh = "1.0.3"
iroh-mdns-address-lookup = "0.4.0"
noq-proto = "1.0.0"
futures = "0.3"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["full"] }
socket2 = "0.6"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
rand = "0.10"
base64 = "0.22"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flexaccess-keys = { git = "https://github.com/flexaccessdev/flexaccess-keys", rev = "20eb59792598c3e79c4a9831cb8fde67ec0676ec", default-features = false, features = ["commands"] }
toml = "1"
ipnet = "2"
dirs = "6"

[dev-dependencies]
tempfile = "3.24.0"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
